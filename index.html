<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archive</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        }

        :root {
            --bg: #ffffff;
            --card-bg: #ffffff;
            --border-light: #f0f0f2;
            --border-subtle: #e5e5ea;
            --text: #000000;
            --text-sub: #8e8e93;
            --text-muted: #c7c7cc;
            /* 회파랑 계열 컬러 팔레트 */
            --math: #2c4c6f;
            --kor: #5a7d9a;
            --eng: #8fa8be;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }

        .pages-slider {
            display: flex;
            width: 200vw;
            height: 100vh;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
            transform: translateX(0);
            will-change: transform;
        }

        .pages-slider.show-records {
            transform: translateX(-100vw);
        }

        .page {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* ── 1페이지: 달력 ── */
        .cal-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .cal-container {
            width: 100%;
            max-width: 380px;
        }

        .cal-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .cal-month-text {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .cal-nav-btn {
            background: none;
            border: none;
            font-size: 15px;
            color: var(--text-sub);
            cursor: pointer;
            padding: 6px 10px;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            row-gap: 12px;
            column-gap: 4px;
            text-align: center;
        }

        .cal-day-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            padding-bottom: 8px;
        }

        .cal-day-cell {
            height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 4px;
            font-size: 14px;
            font-weight: 400;
        }

        .dots-wrap {
            display: flex;
            gap: 3px;
            margin-top: 5px;
            height: 5px;
            align-items: center;
        }

        .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
        }
        .dot-math { background-color: var(--math); }
        .dot-kor { background-color: var(--kor); }
        .dot-eng { background-color: var(--eng); }

        .cal-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 36px;
            font-size: 12px;
            color: var(--text-sub);
        }

        /* ── 2페이지: 실모 기록부 ── */
        .records-screen {
            flex: 1;
            overflow-y: auto;
            padding: 40px 32px 60px;
            display: flex;
            flex-direction: column;
            gap: 36px;
            -webkit-overflow-scrolling: touch;
        }

        .subject-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .subject-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: 700;
        }

        .subject-tag-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        /* 가로 스크롤 카드 행 */
        .horizontal-cards {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
        }
        .horizontal-cards::-webkit-scrollbar { display: none; }

        .card {
            min-width: 290px;
            max-width: 290px;
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 8px;
        }

        .card-name-input {
            border: none;
            outline: none;
            font-size: 13px;
            font-weight: 700;
            width: 80%;
            background: transparent;
        }

        .btn-del {
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }
        .btn-del:hover { color: #ff3b30; }

        .rounds-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 220px;
            overflow-y: auto;
        }

        .round-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            background: #f9f9fb;
            border-radius: 6px;
            font-size: 12px;
        }

        .round-label {
            font-weight: 600;
            color: var(--text-sub);
            width: 32px;
        }

        .misc-name-input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 12px;
            font-weight: 500;
            max-width: 120px;
        }

        .round-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-input {
            width: 36px;
            text-align: right;
            border: none;
            background: transparent;
            font-weight: 700;
            font-size: 13px;
            outline: none;
        }
        .score-input::placeholder { color: var(--text-muted); font-weight: 400; }

        .date-badge {
            font-size: 10px;
            color: var(--text-sub);
            cursor: pointer;
            min-width: 30px;
            text-align: right;
        }

        .btn-action-outline {
            background: transparent;
            border: 1px dashed var(--border-subtle);
            border-radius: 8px;
            padding: 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            width: 100%;
        }

        .btn-add-series-card {
            min-width: 100px;
            border: 1px dashed var(--border-subtle);
            border-radius: 12px;
            background: transparent;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="pages-slider" id="pagesSlider">

        <!-- ── [1페이지: 달력] ── -->
        <div class="page">
            <div class="cal-screen">
                <div class="cal-container">
                    <div class="cal-header-row">
                        <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
                        <div class="cal-month-text" id="monthTitle"></div>
                        <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
                    </div>

                    <div class="cal-grid">
                        <div class="cal-day-label">일</div>
                        <div class="cal-day-label">월</div>
                        <div class="cal-day-label">화</div>
                        <div class="cal-day-label">수</div>
                        <div class="cal-day-label">목</div>
                        <div class="cal-day-label">금</div>
                        <div class="cal-day-label">토</div>
                    </div>
                    <div class="cal-grid" id="calendarDays"></div>

                    <div class="cal-legend">
                        <span><span class="dot dot-math" style="display:inline-block; margin-right:4px;"></span>수학</span>
                        <span><span class="dot dot-kor" style="display:inline-block; margin-right:4px;"></span>국어</span>
                        <span><span class="dot dot-eng" style="display:inline-block; margin-right:4px;"></span>영어</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── [2페이지: 기록부] ── -->
        <div class="page">
            <div class="records-screen">
                <div id="recordsContainer" style="display:flex; flex-direction:column; gap:32px;"></div>
            </div>
        </div>

    </div>

    <script>
        const EMPTY_DATA = {
            math: { series: [], misc: [] },
            korean: { series: [], misc: [] },
            english: { series: [], misc: [] }
        };

        let appData = JSON.parse(localStorage.getItem('my_silmo_archive_v4'));
        if (!appData) {
            appData = EMPTY_DATA;
            localStorage.setItem('my_silmo_archive_v4', JSON.stringify(appData));
        }

        const now = new Date();
        let curYear = now.getFullYear();
        let curMonth = now.getMonth();

        function saveData() {
            localStorage.setItem('my_silmo_archive_v4', JSON.stringify(appData));
            renderCalendar();
        }

        function goTo(view) {
            const slider = document.getElementById('pagesSlider');
            if (view === 'records') slider.classList.add('show-records');
            else slider.classList.remove('show-records');
        }

        // ── 가로 스크롤 충돌 방지 스와이프 제어 ──
        let startX = 0, startY = 0;
        let isSwipeBlocked = false;

        document.addEventListener('touchstart', (e) => {
            // 실모 카드 목록 내부를 터치했거나 입력창을 터치한 경우 페이지 전환 차단
            if (e.target.closest('.horizontal-cards') || e.target.closest('input')) {
                isSwipeBlocked = true;
                return;
            }
            isSwipeBlocked = false;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (isSwipeBlocked) return;
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;

            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) {
                if (dx < 0) goTo('records');
                else goTo('calendar');
            }
        }, { passive: true });

        // 달력
        function changeMonth(delta) {
            curMonth += delta;
            if (curMonth < 0) { curMonth = 11; curYear--; }
            else if (curMonth > 11) { curMonth = 0; curYear++; }
            renderCalendar();
        }

        function renderCalendar() {
            document.getElementById('monthTitle').innerText = `${curYear}. ${String(curMonth + 1).padStart(2, '0')}`;
            const grid = document.getElementById('calendarDays');
            grid.innerHTML = '';

            const firstDay = new Date(curYear, curMonth, 1).getDay();
            const totalDays = new Date(curYear, curMonth + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${curYear}-${String(curMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const cell = document.createElement('div');
                cell.className = 'cal-day-cell';
                cell.innerHTML = `<span>${day}</span><div class="dots-wrap"></div>`;

                const dotsWrap = cell.querySelector('.dots-wrap');

                ['math', 'korean', 'english'].forEach(sub => {
                    const hasSeries = appData[sub].series.some(s => s.rounds.some(r => r.date === dateStr && r.score !== ''));
                    const hasMisc = appData[sub].misc.some(m => m.date === dateStr && m.score !== '');
                    if (hasSeries || hasMisc) {
                        const dot = document.createElement('span');
                        dot.className = `dot dot-${sub === 'math' ? 'math' : sub === 'korean' ? 'kor' : 'eng'}`;
                        dotsWrap.appendChild(dot);
                    }
                });

                grid.appendChild(cell);
            }
        }

        // 기록부
        const SUBJECTS = [
            { key: 'math', name: '수학', color: 'var(--math)' },
            { key: 'korean', name: '국어', color: 'var(--kor)' },
            { key: 'english', name: '영어', color: 'var(--eng)' }
        ];

        function getTodayYYYYMMDD() {
            return new Date().toISOString().split('T')[0];
        }

        function renderRecords() {
            const container = document.getElementById('recordsContainer');
            container.innerHTML = '';

            SUBJECTS.forEach(sub => {
                const subData = appData[sub.key];
                const section = document.createElement('div');
                section.className = 'subject-group';

                section.innerHTML = `
                    <div class="subject-title">
                        <span class="subject-tag-dot" style="background:${sub.color}"></span>
                        <span>${sub.name}</span>
                    </div>
                    <div class="horizontal-cards" id="row-${sub.key}"></div>
                `;

                const row = section.querySelector(`#row-${sub.key}`);

                // 1. 시리즈 카드
                subData.series.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header-row">
                            <input class="card-name-input" value="${s.name}" onchange="updateSeriesName('${sub.key}', '${s.id}', this.value)" />
                            <button class="btn-del" onclick="delSeries('${sub.key}', '${s.id}')">×</button>
                        </div>
                        <div class="rounds-list">
                            ${s.rounds.map(r => `
                                <div class="round-row">
                                    <span class="round-label">${r.round}회</span>
                                    <div class="round-right">
                                        <input class="score-input" type="number" placeholder="--" value="${r.score}" 
                                            onchange="updateRoundScore('${sub.key}', '${s.id}', ${r.round}, this.value)" />
                                        <span class="date-badge" onclick="editRoundDate('${sub.key}', '${s.id}', ${r.round})">${formatDateDisplay(r.date)}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    row.appendChild(card);
                });

                // 2. 기타(단발성) 실모 카드
                const miscCard = document.createElement('div');
                miscCard.className = 'card';
                miscCard.innerHTML = `
                    <div class="card-header-row">
                        <span style="font-size:13px; font-weight:700; color:var(--text-sub);">기타</span>
                    </div>
                    <div class="rounds-list">
                        ${subData.misc.length === 0 ? '<div style="font-size:11px; color:#c7c7cc; padding:10px 0; text-align:center;">기록 없음</div>' : ''}
                        ${subData.misc.map(m => `
                            <div class="round-row">
                                <input class="misc-name-input" value="${m.name}" onchange="updateMiscName('${sub.key}', '${m.id}', this.value)" />
                                <div class="round-right">
                                    <input class="score-input" type="number" placeholder="--" value="${m.score}" 
                                        onchange="updateMiscScore('${sub.key}', '${m.id}', this.value)" />
                                    <span class="date-badge" onclick="editMiscDate('${sub.key}', '${m.id}')">${formatDateDisplay(m.date)}</span>
                                    <button class="btn-del" onclick="delMisc('${sub.key}', '${m.id}')">×</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn-action-outline" onclick="addMiscItem('${sub.key}')">+ 추가</button>
                `;
                row.appendChild(miscCard);

                // 3. 시리즈 추가 버튼
                const addSeriesBtn = document.createElement('button');
                addSeriesBtn.className = 'btn-add-series-card';
                addSeriesBtn.innerHTML = `<span style="font-size:16px;">+</span><span>시리즈</span>`;
                addSeriesBtn.onclick = () => addSeries(sub.key);
                row.appendChild(addSeriesBtn);

                container.appendChild(section);
            });
        }

        function formatDateDisplay(dStr) {
            if (!dStr) return '';
            const parts = dStr.split('-');
            if (parts.length === 3) return `${parts[1]}.${parts[2]}`;
            return dStr;
        }

        // ── 시리즈 함수 ──
        function updateSeriesName(subKey, seriesId, newName) {
            const series = appData[subKey].series.find(s => s.id === seriesId);
            if (series) series.name = newName;
            saveData();
        }

        function updateRoundScore(subKey, seriesId, roundNum, val) {
            const series = appData[subKey].series.find(s => s.id === seriesId);
            if (series) {
                const targetRound = series.rounds.find(r => r.round === roundNum);
                if (targetRound) {
                    targetRound.score = val === '' ? '' : Number(val);
                    if (val !== '' && !targetRound.date) targetRound.date = getTodayYYYYMMDD();
                    if (val === '') targetRound.date = '';
                }
            }
            saveData();
            renderRecords();
        }

        function editRoundDate(subKey, seriesId, roundNum) {
            const series = appData[subKey].series.find(s => s.id === seriesId);
            if (!series) return;
            const target = series.rounds.find(r => r.round === roundNum);
            if (!target || target.score === '') return;

            const newDate = prompt('날짜 (YYYY-MM-DD)', target.date || getTodayYYYYMMDD());
            if (newDate) {
                target.date = newDate;
                saveData();
                renderRecords();
            }
        }

        function addSeries(subKey) {
            const name = prompt('시리즈 이름');
            if (!name) return;
            const countStr = prompt('총 회차 수');
            const total = parseInt(countStr);
            if (!total || total <= 0) return;

            appData[subKey].series.push({
                id: 's_' + Date.now(),
                name: name,
                rounds: Array.from({ length: total }, (_, i) => ({ round: i + 1, score: '', date: '' }))
            });
            saveData();
            renderRecords();
        }

        function delSeries(subKey, seriesId) {
            if (!confirm('삭제하시겠습니까?')) return;
            appData[subKey].series = appData[subKey].series.filter(s => s.id !== seriesId);
            saveData();
            renderRecords();
        }

        // ── 기타 실모 함수 (이름만 먼저 등록, 점수는 추후 입력) ──
        function addMiscItem(subKey) {
            const name = prompt('실모 이름');
            if (!name) return;

            appData[subKey].misc.push({
                id: 'm_' + Date.now(),
                name: name,
                score: '',
                date: ''
            });
            saveData();
            renderRecords();
        }

        function updateMiscName(subKey, miscId, newName) {
            const target = appData[subKey].misc.find(m => m.id === miscId);
            if (target) target.name = newName;
            saveData();
        }

        function updateMiscScore(subKey, miscId, val) {
            const target = appData[subKey].misc.find(m => m.id === miscId);
            if (target) {
                target.score = val === '' ? '' : Number(val);
                if (val !== '' && !target.date) target.date = getTodayYYYYMMDD();
                if (val === '') target.date = '';
            }
            saveData();
            renderRecords();
        }

        function editMiscDate(subKey, miscId) {
            const target = appData[subKey].misc.find(m => m.id === miscId);
            if (!target || target.score === '') return;

            const newDate = prompt('날짜 (YYYY-MM-DD)', target.date || getTodayYYYYMMDD());
            if (newDate) {
                target.date = newDate;
                saveData();
                renderRecords();
            }
        }

        function delMisc(subKey, miscId) {
            appData[subKey].misc = appData[subKey].misc.filter(m => m.id !== miscId);
            saveData();
            renderRecords();
        }

        renderCalendar();
        renderRecords();
    </script>
</body>
</html>
